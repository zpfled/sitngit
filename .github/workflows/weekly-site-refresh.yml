name: Weekly site refresh

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Netlify build
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "::error::Missing repository secret NETLIFY_BUILD_HOOK_URL."
            exit 1
          fi
          if ! curl --fail --silent --output /dev/null --connect-timeout 10 --max-time 60 \
            --request POST --data '{}' "$NETLIFY_BUILD_HOOK_URL"; then
            echo "::error::Netlify build hook POST failed. Check the secret and Netlify build hook."
            exit 1
          fi
